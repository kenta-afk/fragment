<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fragment diary app</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="panel editor">
        <h1>fragment diary</h1>
        <label class="field">
          <span>日記</span>
          <textarea id="diary-input" placeholder="今日の出来事を書きましょう"></textarea>
        </label>

        <label class="field">
          <span>壁紙画像</span>
          <input id="wallpaper-input" type="file" accept="image/*" />
        </label>

        <div class="actions">
          <button id="screenshot-button" type="button">スクリーンショットを保存</button>
          <button id="post-button" type="button">X に投稿</button>
        </div>
      </section>

      <section class="panel preview">
        <h2>プレビュー</h2>
        <article id="diary-preview-card" class="diary-card">
          <p id="diary-preview-text">今日の出来事を書きましょう</p>
        </article>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
